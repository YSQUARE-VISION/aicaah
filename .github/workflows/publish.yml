name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to publish from this tag (for example 0.1)'
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - name: Check version against the selected tag and input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,aicaah; assert aicaah.__version__ == os.environ['RELEASE_VERSION']; assert os.environ['RELEASE_TAG'] == 'v' + aicaah.__version__"
      - run: python -m pip check
      - run: python -m aicaah selftest --portable
      - uses: pypa/gh-action-pypi-publish@release/v1
